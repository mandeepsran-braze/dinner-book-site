<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1E6B58"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dinners"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Weeknight Dinner Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column of cards on a phone, three across on a desktop. A full-screen sheet opens for one recipe. */
:root {
  --bg: #F5F8F6; --surface: #FFFFFF; --surface-2: #EBF1EE; --ink: #18221F; --ink-2: #53625C; --line: #DAE4DF;
  --main: #1E6B58; --on-main: #FFFFFF; --main-text: #1B6350; --main-tint: #E1EFE9;
  --side: #A65A19; --side-text: #94500F; --side-tint: #F9EAD9;
  --protein: #1E6B58; --carb: #D9A020; --fat: #D2593F;
  --warn-text: #7A5000; --warn-tint: #FFF1CF; --info-text: #1D4E7A; --info-tint: #E1EDF8;
  --shadow: 0 1px 2px rgb(20 40 33 / 0.06), 0 8px 24px rgb(20 40 33 / 0.07);
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1513; --surface: #151F1C; --surface-2: #1C2925; --ink: #E6EFEB; --ink-2: #9DB0A9; --line: #26352F;
    --main: #58C2A1; --on-main: #0A1613; --main-text: #7FD6B8; --main-tint: #16302A;
    --side: #E5A15F; --side-text: #EDB57C; --side-tint: #33261A;
    --protein: #58C2A1; --carb: #E3B24A; --fat: #E57C65;
    --warn-text: #F1CF7A; --warn-tint: #33290F; --info-text: #8CBDEB; --info-tint: #14283A;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1513; --surface: #151F1C; --surface-2: #1C2925; --ink: #E6EFEB; --ink-2: #9DB0A9; --line: #26352F;
  --main: #58C2A1; --on-main: #0A1613; --main-text: #7FD6B8; --main-tint: #16302A;
  --side: #E5A15F; --side-text: #EDB57C; --side-tint: #33261A;
  --protein: #58C2A1; --carb: #E3B24A; --fat: #E57C65;
  --warn-text: #F1CF7A; --warn-tint: #33290F; --info-text: #8CBDEB; --info-tint: #14283A;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { overflow-x: clip; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--main); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: 16px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: grid; gap: 10px; padding-block: 12px 10px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 1.55rem; line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.brand .count { color: var(--ink-2); font-size: 0.85rem; white-space: nowrap; }
.searchrow { display: flex; flex-wrap: wrap; gap: 8px; }
.top .wrap > *, .filters > *, main.wrap > * { min-width: 0; }
.search { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding-inline: 12px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding-block: 11px; outline: none; }
.search:focus-within { border-color: var(--main); box-shadow: 0 0 0 3px color-mix(in srgb, var(--main) 25%, transparent); }
.search .clear { border: 0; background: none; color: var(--ink-2); padding: 4px; display: none; }
.search.has .clear { display: inline-flex; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 14px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--main); }
.btn.primary { background: var(--main); border-color: var(--main); color: var(--on-main); }
.btn.ghost { background: transparent; }
.btn[aria-pressed="true"] { background: var(--main-tint); border-color: var(--main); color: var(--main-text); }
.filters { display: grid; gap: 10px; padding-top: 12px; }
.hint { margin: 0; font-size: 0.8rem; color: var(--ink-2); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 0.88rem; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--main); border-color: var(--main); color: var(--on-main); }
.chip.side[aria-pressed="true"] { background: var(--side); border-color: var(--side); color: var(--on-main); }
.chiplabel { flex: none; align-self: center; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); padding-right: 2px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding-block: 12px 4px; }
.bar select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; }
.bar .meta { color: var(--ink-2); font-size: 0.9rem; }
.linkbtn { border: 0; background: none; color: var(--main-text); font-weight: 600; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; padding-block: 8px 28px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.card .open { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 14px; border-radius: 16px; flex: 1; }
.card .open:focus-visible { outline: 3px solid var(--main); outline-offset: -3px; }
.card .ct { display: block; font-family: var(--display); font-weight: 600; font-size: 1.15rem; line-height: 1.22; margin: 0; padding-right: 40px; text-wrap: balance; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-right: 40px; }
.tag { font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase; font-weight: 700; border-radius: 6px; padding: 2px 7px; background: var(--main-tint); color: var(--main-text); }
.tag.side { background: var(--side-tint); color: var(--side-text); }
.tag.warn { background: var(--warn-tint); color: var(--warn-text); }
.tag.info { background: var(--info-tint); color: var(--info-text); }
.stats { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 4px 18px; }
.stats > span { display: grid; }
.stats b { font-weight: 700; font-size: 1.02rem; }
.stats span { font-size: 0.72rem; color: var(--ink-2); }
.mini { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; }
.mini i { display: block; height: 100%; }
.mini .p { background: var(--protein); } .mini .c { background: var(--carb); } .mini .f { background: var(--fat); }
.rate { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--ink-2); }
.heart { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; color: var(--ink-2); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.heart:hover { background: var(--surface-2); }
.heart[aria-pressed="true"] { color: var(--fat); }
.heart[aria-pressed="true"] svg { fill: currentColor; }
.empty { text-align: center; padding: 48px 16px; color: var(--ink-2); display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-family: var(--display); color: var(--ink); margin: 0; font-size: 1.3rem; }
.more { display: flex; justify-content: center; padding-bottom: 36px; }

/* recipe sheet */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-in { max-width: 780px; margin-inline: auto; padding: 0 16px 120px; }
.sheet-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding-block: 10px; background: var(--bg); }
.sheet-bar .grp { display: flex; flex-wrap: wrap; gap: 8px; }
.sheet-in, .sheet-in > * { min-width: 0; }
.sheet h2.title { font-family: var(--display); font-weight: 700; font-size: clamp(1.7rem, 5.5vw, 2.4rem); line-height: 1.12; letter-spacing: -0.015em; margin: 6px 0 10px; text-wrap: balance; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 12px 0 4px; }
.facts div { display: grid; }
.facts b { font-size: 1.2rem; font-weight: 700; }
.facts span { font-size: 0.74rem; color: var(--ink-2); letter-spacing: 0.06em; text-transform: uppercase; }
.stars { display: inline-flex; gap: 2px; color: var(--carb); }
.stars svg { width: 1em; height: 1em; fill: currentColor; stroke: none; }
.stars .off { color: var(--line); }
.callout { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; font-size: 0.92rem; }
.callout.warn { background: var(--warn-tint); color: var(--warn-text); }
.callout.info { background: var(--info-tint); color: var(--info-text); }
.sec { margin-top: 28px; }
.sec h3 { font-family: var(--display); font-size: 1.3rem; margin: 0 0 10px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec h3 small { font-family: var(--body); font-size: 0.8rem; font-weight: 500; color: var(--ink-2); }
.ctrls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; overflow: hidden; }
.stepper button { border: 0; background: transparent; width: 42px; height: 40px; font-size: 1.25rem; }
.stepper button:hover { background: var(--surface-2); }
.stepper output { min-width: 78px; text-align: center; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 9px 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--main); color: var(--on-main); }
ul.ing { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
ul.ing li { border-top: 1px solid var(--line); }
ul.ing li:first-child { border-top: 0; }
ul.ing label { display: grid; grid-template-columns: 22px 6.6rem 1fr; gap: 10px; align-items: baseline; padding: 11px 14px; cursor: pointer; }
ul.ing input { width: 18px; height: 18px; accent-color: var(--main); margin: 0; align-self: center; }
ul.ing .a { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
ul.ing .t small { color: var(--ink-2); }
ul.ing input:checked ~ span { color: var(--ink-2); text-decoration: line-through; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
ol.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
ol.steps li::before { counter-increment: s; content: counter(s); font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--main-text); line-height: 1.3; }
ol.steps li.done { opacity: 0.55; }
ol.steps .txt { cursor: pointer; overflow-wrap: anywhere; }
.timers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--main); color: var(--main-text); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 0.85rem; font-weight: 600; }
.tbtn:hover { background: var(--main-tint); }

/* nutrition */
.nut { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .nut { grid-template-columns: 1fr 1fr; align-items: start; } }
.label { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; padding: 10px 12px; font-size: 0.95rem; max-width: 380px; }
.label h4 { margin: 0; font-family: var(--display); font-size: 1.5rem; line-height: 1.1; border-bottom: 8px solid var(--ink); padding-bottom: 4px; }
.label .per { font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid var(--ink); display: flex; justify-content: space-between; }
.label .cal { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 5px solid var(--ink); padding: 2px 0 4px; }
.label .cal b { font-size: 1.9rem; font-family: var(--display); }
.label .dv { text-align: right; font-size: 0.78rem; padding: 3px 0; border-bottom: 1px solid var(--ink); }
.label .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--line); }
.label .row.sub { padding-left: 16px; }
.label .row b { font-weight: 700; }
.label .foot { font-size: 0.75rem; color: var(--ink-2); padding-top: 6px; }
.donutbox { display: grid; gap: 12px; justify-items: center; }
.legend { display: grid; gap: 6px; font-size: 0.92rem; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.note { font-size: 0.85rem; color: var(--ink-2); }
.related { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.related button { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 4px; }
.related button:hover { border-color: var(--main); }
.related b { font-family: var(--display); font-weight: 600; line-height: 1.25; }
.related span { font-size: 0.82rem; color: var(--ink-2); }

/* timers bar + cook mode */
.tbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; pointer-events: none; }
.tbar .t { pointer-events: auto; max-width: 520px; width: 100%; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); }
.tbar .t.done { background: var(--fat); color: #fff; animation: pulse 1s ease-in-out infinite; }
.tbar .t b { font-variant-numeric: tabular-nums; font-size: 1.15rem; }
.tbar .t span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9rem; }
.tbar .t button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 8px; padding: 4px 10px; font-weight: 600; }
@keyframes pulse { 50% { filter: brightness(1.15); } }
@media (prefers-reduced-motion: reduce) { .tbar .t.done { animation: none; } }
.cook { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.cook header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
.cook .prog { display: flex; gap: 4px; padding-inline: 16px; }
.cook .prog i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.cook .prog i.on { background: var(--main); }
.cook main { display: grid; align-content: center; gap: 16px; padding: 16px 20px; max-width: 760px; width: 100%; margin-inline: auto; overflow-y: auto; }
.cook .stepn { font-family: var(--display); color: var(--main-text); font-weight: 700; font-size: 1.1rem; }
.cook .stept { font-size: clamp(1.4rem, 4.6vw, 2.1rem); line-height: 1.35; overflow-wrap: anywhere; }
.cook footer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 16px 16px; max-width: 760px; width: 100%; margin-inline: auto; }
.cook footer .btn { padding-block: 16px; font-size: 1.05rem; }
.cook .drawer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 0.95rem; }
.cook .drawer ul { margin: 6px 0 0; padding-left: 18px; }
.foot-note { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); }

/* plan */
.badge { background: var(--main); color: var(--on-main); border-radius: 999px; min-width: 20px; height: 20px; padding-inline: 6px; display: inline-grid; place-items: center; font-size: 0.75rem; font-weight: 700; }
.badge[hidden] { display: none; }
.plan { z-index: 35; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.pcard .nm { all: unset; cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 1.1rem; line-height: 1.25; overflow-wrap: anywhere; }
.pcard .nm:hover { text-decoration: underline; text-underline-offset: 3px; }
.pcard .row2 { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.pcard .sub { color: var(--ink-2); font-size: 0.88rem; }
.plist { display: grid; gap: 10px; }
.sgroup { margin-top: 18px; }
.sgroup h4 { margin: 0 0 6px; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
ul.shop { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
ul.shop li { border-top: 1px solid var(--line); }
ul.shop li:first-child { border-top: 0; }
ul.shop label { display: grid; grid-template-columns: 22px 6.2rem 1fr; gap: 10px; align-items: baseline; padding: 10px 14px; cursor: pointer; }
ul.shop input { width: 18px; height: 18px; accent-color: var(--main); margin: 0; align-self: center; }
ul.shop .a { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
ul.shop .t small { display: block; color: var(--ink-2); font-size: 0.8rem; }
ul.shop input:checked ~ span { color: var(--ink-2); text-decoration: line-through; }
.use { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; }
.use p { margin: 0; font-size: 0.95rem; }
.use .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.use .links button { border: 1px solid var(--main); background: transparent; color: var(--main-text); border-radius: 999px; padding: 3px 10px; font-size: 0.85rem; font-weight: 600; text-align: left; }
.codebox { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; font-size: 0.8rem; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink-2); }
details.pd { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
details.pd summary { cursor: pointer; padding: 10px 0; font-weight: 600; }
details.pd[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 10px; }
details.pd ul { margin: 0 0 12px; padding-left: 18px; }
details.pd ol.steps { margin-bottom: 12px; }
@media (max-width: 560px) { #surprise span { display: none; } #surprise { padding-inline: 12px; } .brand h1 { font-size: 1.3rem; } .search { flex-basis: 140px; } }
.sched { display: grid; gap: 8px; }
.srow { display: grid; grid-template-columns: 5.4rem 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.sday { font-family: var(--display); font-weight: 700; font-size: 1.05rem; line-height: 1.2; }
.sday small { display: block; font-family: var(--body); font-weight: 500; font-size: 0.74rem; color: var(--ink-2); margin-top: 2px; }
.smeal { min-width: 0; display: grid; gap: 4px; }
.smeal .nm2 { all: unset; cursor: pointer; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.smeal .nm2:hover { text-decoration: underline; text-underline-offset: 3px; }
.smeal .plus { color: var(--ink-2); font-size: 0.85rem; }
.sn { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 0.82rem; color: var(--ink-2); }
.sn b { color: var(--ink); }
.pbar { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--protein); border-radius: 3px; }
@media (max-width: 420px) { .srow { grid-template-columns: 1fr; gap: 4px; } }

:9.7,"su":2.5,"so":154,"sf":1,"ch":0,"ing":[[2,"count","artichoke","","produce",0],[1,"count","lemon","halved","produce",0],[4,"count","garlic clove","","produce",0],[30,"mL","champagne vinegar","","pantry",0],[1,"count","lemon","juiced","produce",0],[1,"count","shallot","minced","produce",0],[5,"mL","herb seasoning mix","","spice",0],[30,"mL","extra virgin olive oil","","pantry",1],[0,"to_taste","salt","","spice",1],[0,"to_taste","black pepper","","spice",1]],"st":["Slice about 1 inch off the top of each artichoke and trim the stems. Remove the tough outer leaves and trim any sharp, thorny leaf tips with scissors. Put about 2 inches of water in a large pot with garlic and lemon, insert a rack or steamer basket into the pot and bring the water to a boil. Meanwhile, prepare an ice bath.","Place the artichokes on the rack (stem end down) and steam uncovered, until the bottom is tender and the outer leaves can be pulled off easily, about 30 to 40 minutes.","Remove the artichokes with a large spoon and plunge them into the ice bath. Drain and refrigerate until serving time. (Turn the artichokes upside down and leave them upside down in the refrigerator so that all of the water drains from the leaves.).","(The artichokes can be cooked in advance and stored in the refrigerator for up to 2 days.).","In a small bowl, whisk the Champagne vinegar and lemon juice together. Add the herbs & shallots and slowly whisk in the olive oil. Season with salt and pepper to taste.","(The vinaigrette can be made in advance and stored in the refrigerator for up to 5 days.).","Serve the artichokes with a martini glass with a bowl of vinaigrette to dip the leaves inches."],"ad":"","on":"","sim":[61001]},{"i":118188,"n":"Zucchini Casserole","r":"m","g":"Chicken","sv":4,"t":50,"pa":0,"rt":5.0,"rv":4,"k":441,"p":38.7,"cb":33,"f":18.1,"fi":4,"su":8.4,"so":966,"sf":8.6,"ch":133,"ing":[[6,"count","zucchini","","produce",0],[454,"g","ground chicken","","meat",0],[1,"count","canned tomato bisque soup s.  The sheet should sizzle a bit when the batter hits it. Leave one inch between each latke.","Bake the latkes in the oven until golden brown, 6 to 8 minutes per side,turning once with a spatula. (When you turn the latkes, try to flip them onto spots on the baking sheet that still have oil.).","Serving suggestions:  If you are in a sweet mood serve latkes with sour cream and strawberiy or raspberry preserves. Savroy more your style, then try sour cream alone or with some chopped scallions."],"ad":"","on":"","sim":[176319,10266,359149]},{"i":135254,"n":"Peas in Tomato Sauce (Revithia Me Saltsa Domata)","r":"s","g":"Vegetables","sv":4,"t":25,"pa":0,"rt":5.0,"rv":5,"k":95,"p":3.5,"cb":13.5,"f":3.8,"fi":3.5,"su":6.6,"so":82,"sf":0.6,"ch":0,"ing":[[15,"mL","extra virgin olive oil","","pantry",1],[1,"count","onion","chopped","produce",0],[1,"count","garlic clove","minced","produce",0],[2,"count","tomato","chopped","produce",0],[1,"count","canned diced tomatoes 398 mL","","canned",0],[4,"g","sugar","","pantry",1],[1,"bunch","fresh oregano","","produce",0],[1,"bunch","fresh basil","","produce",0],[250,"mL","water","","other",1],[1,"count","canned tomato paste 156 mL","","canned",0],[1,"count","zucchini","sliced","produce",0],[0,"to_taste","salt","","spice",1]],"st":["Remove peas from the freezer so that they can begin to thaw while the dish is simmering.","Add olive oil and onions to a large skillet over medium heat.  Cook 2 or 3 minutes until the onions soften a bit.  Add the minced garlic and stir a minute.","Add the tomatoes (canned and paste), sugar, oregano, basil, and water to the onions.  Continue to cook another 5 minutes so that flavors begin to come together. Adjust seasonings as desired at this point. Add zucchini and cook 5 to 8 minutes. The zucchini should be cooked but still firm.","Add the thawed peas and stir again until the peas are warm, about 2 or 3 minutes.","Serve warm."],"ad":"","on":"","sim":[130567,119130,54443]},{"i":135823,"n":"Chicken Breast Stuf re is heating, blanch the potatoes in boiling salted water until tender (you should be able to stick a toothpick into them but still feel some resistance), about 5 to 8 minutes.","Cut the potatoes in half lengthwise, rub them lightly all over with oil and sprinkle them generously with salt and pepper. Arrange them, cut side down, over the hottest coals and cook until the potatoes are crusty and brown, about 4 minutes per side.","Meanwhile, place a sturdy foil pan large enough to hold all of the potatoes in a single layer on the cooler side of the grill, away from the fire.","Transfer the grilled potatoes to the pan, placing them cut side up, and scatter the blue cheese over them.","Allow the cheese to melt slightly, then serve hot."],"ad":"","on":"","sim":[178925,429076]},{"i":162414,"n":"Best Lima Beans You'll Ever Eat!","r":"s","g":"Beans and lentils","sv":8,"t":25,"pa":0,"rt":5.0,"rv":16,"k":181,"p":7.1,"cb":15.4,"f":10.4,"fi":4.2,"su":1.8,"so":195,"sf":4.1,"ch":19,"ing":[[450,"g","frozen lima beans","","frozen",0],[170,"g","bacon","cut in segments","meat",0],[1,"count","yellow onion","diced","produce",0],[120,"g","button mushroom","sliced","produce",0],[165,"mL","low-fat sour cream","","dairy",0],[5,"mL","curry powder","","spice",1],[0,"to_taste","seasoning salt","","spice",1]],"st":["Cook frozen lima beans per pkg directions while following remaining steps & set aside.","Roughly dice the medium onion & set aside.","Cut each large mushroom in half from top down through any stem. Put the cut edge down on your cutting board & slice each half in approx 1/3 inch slices & set aside.","Cut bacon slices in 1/2 inch segments & fry in a non-stick skillet until crisp. If you have more than 2 tbsp of rendered bacon fat grease, remove the excess of that amount.","Add diced onion & sliced mushrooms to skillet & saute until onion is translucent. Do not overcook to carmelized state.","Add 1 tsp curry powder + low-fat sour cream & combine well.","Taste & add additional curry po il chicken is tender (do not boil but simmer; this may take longer).  You may want to remove the white meat first.  Remove all chicken; keep chicken warm while preparing sauce.","Mix flour and sour cream, add a bit of sauce from chicken and mix together.  Put this back into the pot – mix with sauce.  Cook 1 minute without boiling.  Taste for seasoning – add salt if necessary or more paprika.  Return chicken pieces to the pot.","Serve with buttered noodles or rice."],"ad":"","on":"","sim":[442191,207367,304564]},{"i":187157,"n":"Pork Chops With Fennel and Caper Sauce","r":"m","g":"Pork","sv":4,"t":45,"pa":0,"rt":5.0,"rv":3,"k":580,"p":52.8,"cb":19.8,"f":30,"fi":6.6,"su":5.6,"so":752,"sf":7.5,"ch":152,"ing":[[60,"mL","olive oil","","pantry",1],[800,"g","pork chop boneless","","meat",0],[0,"to_taste","salt","","spice",1],[0,"to_taste","black pepper","ground","spice",1],[2,"count","fennel bulb","sliced","produce",0],[2,"count","shallot","sliced","produce",0],[1,"bunch","flat-leaf parsley","chopped","produce",0],[1,"bunch","flat-leaf parsley","chopped","produce",0],[125,"mL","white wine","","other",0],[1,"count","canned diced tomatoes 398 mL","","canned",0],[1,"count","lemon","zested","produce",0],[30,"mL","capers","","canned",0]],"st":["In a large, heavy skillet heat the olive oil over high heat. Season the pork chops with salt and pepper.","Add the pork to the pan and brown on both sides, about 4 minutes each side. Remove the pork from the pan, cover loosely with foil, and set aside.","Add the fennel, shallots, and 1/3 cup parsley to the pan and cook over medium heat until beginning to brown, about 5 minutes. Add the wine. Using a wooden spoon, scrape the brown bits off the bottom of the pan. Add the tomatoes and stir.","Add the pork back into the pan, nestling the chops between the fennel and tomatoes so they are mostly submerged in the pan juices. Cook until the fennel is tender and the pork is done, about 12 to 15 minutes.","Place the pork on a serving dish. To fini ast boneless skinless","","meat",0],[0,"to_taste","salt","","spice",1],[0,"to_taste","black pepper","","spice",1],[16,"g","all-purpose flour","","pantry",1],[15,"g","butter","","dairy",0],[15,"mL","olive oil","","pantry",1],[125,"mL","dry white wine","","pantry",0],[125,"mL","chicken broth","","pantry",0],[1,"bunch","fresh parsley","chopped","produce",0],[1,"count","egg","","dairy",0],[2,"count","lemon","juiced","produce",0]],"st":["Flatten each chicken breast by pounding gently with a flat meat mallet (Hint - pound chicken inside a Ziploc bag - no mess!).  Sprinkle flattened breasts with salt and pepper.  Then dredge chicken in flour; shake off excess.","Heat butter and oil over HIGH heat; just before butter starts to brown, add the chicken pieces and saute quickly to brown, about 3 minutes. Flip and brown other side (3 more minutes).   It doesn't need to be totally cooked through because it will cook more in the sauce later.","Remove chicken to platter but leave all browned bits in the skillet.","Add wine to browned bits in skillet and boil to reduce wine by almost half (about 3 minutes). Add chicken broth and bring to a boil.","In a small bowl, whisk together egg and lemon juice.  Stir egg/lemon mixture into simmering wine and broth, whisking constantly until sauce is smooth and a little thickened (about 2 minutes).  It will thicken more when you put in the chicken breasts which have a flour coating.","Add chicken and any juices back into the sauce; allow to simmer about 5 minutes until chicken is cooked through, turning chicken once.  Add chopped parsley.","Place chicken on platter and pour sauce over top; garnish with lemon slices and additional parsley sprigs.","HINT: Please use FRESH lemons and parsley; it has a big impact on the flavor of the dish, and besides, no aspiring Italian chef would consider using otherwise!"],"ad":"","on":"","sim":[21943,267283,305413]},{"i":207157,"n":"Tuna Au Poivre (Tuna With Ground Black Pepper)","r":"m","g":"Fish and seafood","sv":4,"t":25,"pa":0,"rt":4.5,"rv":4,"k":297,"p":27.2,"cb":5,"f":14.8,"fi":0.9,"su":0.3,"so":49,"sf":5.6,"ch":58,"ing":[[0,"to_taste","black pepper","coarse ground","spice",1],[15,"mL","extra virgin olive oil","","pantry",1],[450,"g","tuna steak","","seafood",0],[0,"to_taste","salt","","spice",1],[28,"g","unsalted butter","","dairy",0],[2,"count","shallot","minced","produce",0],[190,"mL","dry red wine","","pantry",0]],"st":["Preheat the oven to 500 degrees. Put the pepper on a flat plate. Place a large skillet, preferably non-stick, over medium-high heat; add the olive oil. Dredge both sides of each piece of tuna lightly in the pepper; it will adhere nicely, forming a thin coat. (Use a bit more pepper if necessary.).","As they're dredged, add the steaks to the pan. Turn the heat to high. Cook about 2 minutes, then turn. Add salt and cook 1 more minute. Turn heat to low and remove tuna to an ovenproof plate. Place in oven.","Add half the butter to the pan, followed by the shallots. Lower the heat to medium and cook, stirring, until the shallots soften, about 2 minutes. Raise the heat to medium-high and add the wine; let it bubble away for a minute or so and add the remaining butter. Cook, stirring occasionally, until the butter melts and the sauce is thickened.","By this time the tuna will be medium-rare (cut into one to make certain). Cut the steaks in half, put each serving on a plate, and spoon a little sauce over it."],"ad":"","on":"","sim":[]},{"i":207367,"n":"Cider Vinegar Chicken","r":"m","g":"Chicken","sv":4,"t":30,"pa":0,"rt":5.0,"rv":5,"k":382,"p":18.1,"cb":17.6,"f":26.2,"fi":0.6,"su":14.6,"so":432,"sf":9,"ch":69,"ing":[[45,"mL","olive oil","","pantry",1],[680,"g","chicken breast","","meat",0],[0,"to_taste","black pepper","","spice",1],[1,"count","yellow onion","sliced","produce",0],[1,"bunch","fresh thyme","","produce",0],[45,"mL","honey","","pantry",0],[3,"count","garlic clove","","produce",0],[125,"mL","apple cider vinegar","","pantry",0],[30,"mL","apple ethod for cooking corn:  husk corn and wash off any loose silk.  Place wet corn into Ziploc bag.  Place bag in microwave and cook 4 minutes; rotate ears and cook 2 more minutes.  Let sit 2 minutes to finish cooking.  Cool five minutes and then slice kernels off the cob.","Combine corn kernels, lime juice, lime zest, butter, salt and pepper.  **Can be made ahead up to this point.","Just before serving, add cilantro and toss to combine.  If desired, garnish with lime slices and sprig of cilantro."],"ad":"","on":"","sim":[113280,127153,48296]},{"i":227525,"n":"Lebanese Cabbage Salad","r":"s","g":"Salads","sv":4,"t":20,"pa":0,"rt":5.0,"rv":3,"k":76,"p":2.4,"cb":10.6,"f":3.7,"fi":4.1,"su":5.6,"so":319,"sf":0.5,"ch":0,"ing":[[1,"count","green cabbage","sliced","produce",0],[2,"count","tomato","chopped","produce",0],[0.5,"bunch","parsley","chopped","produce",0],[1,"count","lemon","juiced","produce",0],[0.5,"bunch","green onion","chopped","produce",0],[1,"count","garlic clove","minced","produce",0],[0,"to_taste","salt","","spice",1],[0,"to_taste","black pepper","","spice",1],[30,"mL","olive oil","","pantry",1]],"st":["Cut the cabbage in half. Cut away the hard core and slice the cabbage crosswise into 1/2-inch strips, then crosswise into 3/4-inch pieces. There should be 4 cups; if there is extra, set it aside to add to soup or another salad. Place the cabbage in a mixing bowl.","Add the tomatoes, parsley and scallions, and toss with a fork to combine.","In a small bowl, whisk the lemon juice, garlic and salt until the salt dissolves.  Mix in the oil.","Season the dressing to taste with pepper.  Pour the dressing over the salad, toss for 1 minute to coat it well, then let sit 10 minutes for flavors to meld.  Serve immediately."],"ad":"","on":"","sim":[97766,304619,62029]},{"i":227860,"n":"Grilled Onion Cheeseburgers","r":"m","g":"Turkey","sv":8,"t":45,"pa":0,"rt":5.0,"rv":5,"k":433,"p":27.6,"cb":25.8,"f":25.2,"fi":1.5,"su":4.4,"so":430,"sf":7.1,"ch":99,"ing":[[908,"g","ground turkey","","meat",0],[0.25,"bunch","fresh thyme","","produce",0],[1,"count","garlic clove","","produce",0],[2,"count","yellow onion","sliced","produce",0],[22,"mL","olive oil","","pantry",1],[0,"to_taste","salt","","spice",1],[0,"to_taste","black pepper","","spice",1],[224,"g","smoked mozzarella cheese","","dairy",0],[84,"g","feta cheese","","dairy",0],[30,"mL","olive oil","","pantry",1]],"st":["Combine ground turkey, thyme, garlic and 2 tablespoons added olive oil in medium bowl, mixing lightly but thoroughly.","Lightly shape into eight 1/2-inch thick patties.","Brush both sides of onion slices with oil.","Place patties and onion slices on grid over medium, ash-covered coals.","Grill patties, uncovered, 12-14 minutes until the internal temperature reaches 165 F (74 C) and juices show no pink color, turning occasionally.","Grill onions 15-20 minutes or until tender, turning occasionally and brushing with oil.","Season patties with salt and pepper, as desired.","Top burgers with desired cheese about 1 minute before removing from grill.","Place cheese-topped burgers on bottom of each bun and top with 1/2 of grilled onions.","Close sandwiches.","Note: You can only make 4 burgers, and then cover and refrigerate remaining 4 burgers and onions to use another day for my recipe for \"Meatballs\" and Pasta With Grilled Onions and Fresh Tomato Sauce.","Tip: Any type of sliced cheese may also be used to top burgers, including Cheddar, Swiss, provolone or Gouda."],"ad":"Ground beef swaps to ground turkey, with oil added for moisture in the patties.","on":"Grilled Onion Cheeseburgers","sim":[192257,124253,114602]},{"i":228236,"n":"Corn & Black Bean Casserole","r":"s","g":"Beans and lentils","sv":10,"t":15,"pa":0,"rt":4.5,"rv":3,"k":98,"p":4.8,"cb":18.2,"f":1.5,"fi":4.8,"su":1.2,"so":20,"sf":0.2,"ch":0,"ing":[[280,"g","frozen corn kernels","","frozen",0],[1,"count","red bell pepper","chopped","produce",0],[0.5,"bunch","green onion","chopped","produce",0],[0.25,"bunch","fresh ci ual 1 cup) and stir.","Stir in the tamarind and coriander seeds and season.","Add the chicken, mix well and cook over a medium heat for 8 minutes until cooked through."],"ad":"","on":"","sim":[72101,59633,156780]},{"i":261827,"n":"Chinese General Chicken - Ww Core","r":"m","g":"Chicken","sv":4,"t":20,"pa":0,"rt":4.5,"rv":33,"k":292,"p":28.5,"cb":28.6,"f":6.3,"fi":2.2,"su":0.5,"so":777,"sf":1.2,"ch":73,"ing":[[190,"mL","chicken broth","","canned",0],[16,"g","cornstarch","","pantry",0],[25,"g","granulated sweetener","","pantry",0],[30,"mL","soy sauce","","pantry",0],[15,"mL","white wine vinegar","","pantry",0],[2.5,"mL","ground ginger","","spice",1],[10,"mL","olive oil","","pantry",1],[1,"bunch","green onion","sliced","produce",0],[2,"count","garlic clove","minced","produce",0],[2.5,"mL","crushed red pepper flakes","","spice",1],[454,"g","chicken breast boneless skinless","cut in 2 inch pieces","meat",0],[125,"g","brown rice","","pantry",0]],"st":["Cut chicken into 2 inch pieces.","In a small bowl, mix together chicken broth, cornstarch, Splenda, soy sauce, vinegar and ginger.  Set aside.","Heat oil in skillet or wok over medium-high heat.  Add scallions, garlic and pepper.  Cook 2 minutes, add chicken and cook until browned, about 5 more minutes.","Add sauce and simmer until sauce thickens and chicken is cooked through, about 3 minutes.","Serve chicken and sauce over rice."],"ad":"","on":"","sim":[188816,85242,15580]},{"i":262140,"n":"Cheesy Ham and Potato Soup","r":"m","g":"Pork","sv":8,"t":30,"pa":0,"rt":5.0,"rv":204,"k":325,"p":15.4,"cb":21.1,"f":20.2,"fi":2.3,"su":2.1,"so":912,"sf":12.3,"ch":67,"ing":[[4,"count","potato","diced","produce",0],[1,"count","celery stalk","chopped","produce",0],[1,"count","yellow onion","chopped","produce",0],[1,"count","carrot","chopped","produce",0],[225,"g","cooked ham","diced","meat",0],[800,"mL","chicken broth","","canned",0],[10,"mL","chicken bouillon granules","","pantry",0],[0,"to_taste","salt","","spice",1],[0,"to_taste","bla  minutes, until golden brown. Do not overcook. Remove chicken from pan, and set aside, covered to keep warm.","Remove all but 2 Tbsp of fat, retaining browned bits of breading. Stir wine and broth into pan drippings, deglazing the pan.","Add lemon juice, capers, and parsley. Return chicken to skillet, tossing to coat. Reduce heat to medium, and continue cooking until sauce thickens slightly and chicken is cooked thru. Serve immediately with fresh lemon wedges."],"ad":"","on":"","sim":[206632,316028,224396]},{"i":268111,"n":"Chicken With Mushrooms","r":"m","g":"Chicken","sv":4,"t":37,"pa":0,"rt":4.5,"rv":11,"k":318,"p":38.2,"cb":12,"f":12.7,"fi":1.5,"su":2.4,"so":515,"sf":3.6,"ch":150,"ing":[[750,"g","chicken thigh boneless skinless","","meat",0],[150,"g","white button mushrooms","sliced","produce",0],[210,"g","brown button mushrooms","sliced","produce",0],[1,"count","yellow onion","chopped","produce",0],[2,"count","garlic clove","minced","produce",0],[5,"mL","dried thyme","","spice",1],[0,"to_taste","salt","","spice",1],[0,"to_taste","black pepper","","spice",1],[16,"g","all-purpose flour","","pantry",1],[250,"mL","milk","","dairy",0],[15,"mL","dijon mustard","","pantry",0],[1,"bunch","green onion","chopped","produce",0]],"st":["In a big skillet, heat oil at medium-high heat.  Add chicken thighs and brown on each side.  Set aside in a plate.","Remove the fat from the skillet.  Add mushrooms, onion, garlic, thyme, salt and pepper.  Cook and stir for about 8 minutes or until the liquid of mushrooms has evaporate.  Sprinkle with flour and cook, while stirring, for about 1 minute.  Add milk and bring to boil while scraping the bottom of the skillet to remove the particles.","Put the chicken thighs back in the skillet and their juices.  Add dijon mustard.  Reduce the heat, cover and let simmer for about 10 minutes or until the chicken is not pink inside.  When ready to serve, sprinkle with green onions."],"ad":"","on":"","sim":[181865,186188,31266]},{"i":269778,"n":"Bake  and saute until tender and translucent.","Add rice and stock. Lock lid in place.","Select rice function and set timer for 15 minutes.","When cycle is done and all pressure has been released, open lid.","Stir in black pepper to taste and 1 - 3 tbs romano or parmesan cheese, also to taste. Serve immediately."],"ad":"","on":"","sim":[204501,131050,11653]},{"i":272576,"n":"Pigs in Blankets-Bacon and Sausage Rolls for Christmas Trimmings","r":"m","g":"Pork","sv":12,"t":35,"pa":0,"rt":5.0,"rv":4,"k":444,"p":19.5,"cb":0.1,"f":39.9,"fi":0,"su":0,"so":901,"sf":13.3,"ch":96,"ing":[[1080,"g","chipolata sausage","","meat",0],[540,"g","chipolata sausage","","meat",0],[450,"g","streaky bacon","","meat",0]],"st":["To Prepare:","Cut each rasher of bacon in half and stretch them with a knife;  run the back of a knife along the length of each rasher of bacon to flatten and stretch them slightly - this stops them shrinking during cooking.","Wrap one half rasher of bacon around each sausage, making sure that the seal is underneath the bacon/sausage roll. Skewer with a cocktail stick if neccessary.","Cover them with cling film or place them in a sealed container and store them in the refrigerator until ready to cook or place them in the freezer and defrost them in the refrigerator on Christmas Eve.","To Cook:","Place on a lightly greased oven tray and roast in a pre-heated oven, 200C/400F/gas Mark 5, for 25 to 30 minutes, or until the bacon is cooked and crisp.","Set to one side and keep warm until needed.","These can be cooked ahead of time and reheated in the oven alongside the turkey or roast potatoes for about 5 minutes.","Serve alongside the roast turkey - I always allow 2 per person.","If you skewer thse with a cocktail stick, they make great appetisers too! Serve with cranberry sauce as a dip.","NOTE: If you can only get the normal size chipolata sausages, gently squeeze them in two or three places - see my photos - to make 3 or 4 smaller sausages from 1 longer one; 6 normal sized sausages will yield between 18 and 24 smaller sausages!"],"ad":"","on":"","sim":[]},{"i":273831,"n":"Buca Di Beppo Chicken Glorioso","r":"m","g":"Chicken","sv":4,"t":50,"pa":0,"rt":5.0,"rv":10,"k":472,"p":33.5,"cb":10.7,"f":28.3,"fi":1.9,"su":6.2,"so":691,"sf":5.6,"ch":96,"ing":[[45,"mL","olive oil","","pantry",1],[765,"g","chicken breast boneless skinless","","meat",0],[0,"to_taste","salt","","spice",1],[30,"g","all-purpose flour","","pantry",1],[90,"mL","white wine","","other",0],[3,"count","garlic clove","","produce",0],[2.5,"mL","crushed red pepper flakes","","spice",1],[250,"mL","alfredo sauce","","pantry",0],[30,"mL","sun-dried tomatoes","","pantry",0],[60,"g","mozzarella cheese","shredded","dairy",0],[1,"bunch","fresh parsley","chopped","produce",0]],"st":["Preheat oven to 425 degrees F.","Heat oil on medium high heat. Season the chicken breast with salt and lightly dust with flour.","Saute the chicken breast until browned.","Turn over and brown the other side as well. Remove the chicken breast from the pan and pour off all oil.","Add wine to the pan and return the chicken breasts to the pan as well. Cover and cook the chicken breasts in the pan, turning once, until an internal temperature of 165 degrees is met.","Transfer the chicken breasts to a pan and hold.","Add the garlic, crushed red pepper, and the Alfredo sauce to the wine left in the pan. Bring the sauce to a boil, but do not reduce.","Remove from the flame and add the Sundried Tomatoes. Place about 2/3 of the sauce in the baking dish, reserving about half of the sundried tomatoes.","Place the chicken breasts in the baking dish. Top the chicken breasts with mozzarella. Drizzle the remaining sauce with the sundried tomatoes over the top.","Bake in a 425-degree oven until the sauce becomes bubbly and begins to brown.","Garnish with parsley and serve."],"ad":"","on":"","sim":[120919,15580,150656]},{"i":274363,"n":"Baked Eggs in Tomatoes","r":"s","g":"Vegetables","sv":8,"t":35,"pa":0,"rt":5.0,"rv":3, e",0],[1,"count","lemon","","produce",0],[12,"g","parmesan cheese","","dairy",0],[150,"g","frozen peas","","frozen",0]],"st":["Cook pasta in salted water until al dente, 8 to 10 minutes.","Using a vegetable peeler, slice the zucchini into ribbons and set aside.","Melt the butter in a large skillet over medium-high heat. Add shallots or onions, 1/2 tsp salt, 1/4 tsp pepper and saute until golden, about 5 minutes.","Add wine and cook until it is almost all evaporated, 3 to 4 minutes. Add the broth and cook 2 to 3 minutes.","Reduce heat to medium, add the cream and simmer until just thickened., 3 to 4 minutes.","Add the peas and cook 1 minute.","Add the 1/2 cup cheese and the tuna and cook until heated through, 1 to 2 minutes.","Drain the pasta, reserving a few tablespoons of the cooking water, and add the pasta and reserved cooking water to the skillet.","Add the zucchini, 3 tbl chives, and lemon juice, and toss gently. Correct seasonings.","Transfer to a serving platter and sprinkle with remaining chives and 2 tbl parmesan."],"ad":"","on":"","sim":[125992]},{"i":460995,"n":"Garlic \"mashed\" Creamed Rice","r":"s","g":"Rice and grains","sv":2,"t":30,"pa":0,"rt":4.5,"rv":3,"k":200,"p":4.7,"cb":42.9,"f":0.7,"fi":1.7,"su":1,"so":493,"sf":0.2,"ch":1,"ing":[[250,"mL","water","","other",1],[1,"count","chicken bouillon cube","","pantry",0],[100,"g","white rice","","pantry",0],[15,"mL","fat free sour cream","","dairy",0],[12,"g","lowfat parmesan cheese","grated","dairy",0],[5,"mL","garlic powder","","spice",1],[0,"to_taste","ground black pepper","","spice",1]],"st":["Bring 1 Cup Water & bouillon or Chicken Broth to a boil in saucepan.","Add Rice, cover, and place on low heat for 15-18 minutes (depends on how hard you want the rice in the end).","After rice has reached desired hardness, remove cover and add Sour Cream, Parmesan, Garlic Powder and Black Pepper. Mix well and continue to let simmer.","If rice fails to soften anymore to your preferred texture, add small amounts of water and stir until preferred texture is reached."],"ad":"","on":"","sim":[217802]},{"i":465956,"n":"Enfrijoladas","r":"m","g":"Beans, tofu and eggs","sv":4,"t":40,"pa":0,"rt":5.0,"rv":3,"k":426,"p":22.4,"cb":71,"f":7,"fi":19.2,"su":3.2,"so":586,"sf":1.2,"ch":0,"ing":[[2,"count","canned pinto beans 540 mL","drained","canned",0],[750,"mL","chicken broth","","canned",0],[15,"mL","olive oil","","pantry",1],[1,"count","onion","chopped","produce",0],[1,"count","plum tomato","chopped","produce",0],[1,"count","serrano chili","chopped","produce",0],[2,"count","garlic clove","","produce",0],[2.5,"mL","dried oregano","","spice",1],[8,"count","corn tortilla","","bakery",0],[224,"g","manchego cheese","shredded","dairy",0],[56,"g","monterey jack cheese","shredded","dairy",0],[0,"to_taste","mexican sour cream","","dairy",0]],"st":["Preheat the oven to 350 degrees F.","Put the drained beans and chicken broth in a large bowl.","In a saute pan, heat the olive oil over medium-high heat. Add the onion, tomato, chile, and garlic. Saute until the onion is soft, about 5 minutes. Rub the oregano, between palms of your hands and sprinkle over the beans. Add salt and pepper, to taste. Add the beans and broth to the pan and simmer for 10 minutes. Cool the beans for about 5 minutes before putting them in the blender. Carefully, pour the mixture into a blender and puree. Return the pureed mixture to the pan and gently reheat over medium-low heat, stirring frequently.","Using tongs, pass the tortillas 1 by 1 through the refried bean sauce until they are somewhat softened and coated on both sides with the sauce. Set aside on a plate. Fill each tortilla with 1/4 cup of shredded cheese. Fold in half and arrange them, overlapping, in a 9 by 13-inch baking dish. Top with an additional 1 to 1 1/2 cups of the bean sauce, just enough to cover the beans but allow the edges of the folded tortillas to show. Bake until cheese is melted about 10 to 15 minutes.","To serve, drizzle with Mexican sour cream l repared crust and bake for 15 minutes, or until edges of crust are golden brown.","Remove from oven and top with remaining cup of cheese. Let stand until cheese melts.","Garnish with extra ketchup, mustard and pickle slices."],"ad":"Ground beef in a cheeseburger-style filling swaps to ground turkey, with oil added for moisture.","on":"Cheap Cheeseburger Pie","sim":[53481,316609]},{"i":480224,"n":"Braised Radishes","r":"s","g":"Vegetables","sv":4,"t":25,"pa":0,"rt":5.0,"rv":10,"k":83,"p":0.2,"cb":7.1,"f":6.3,"fi":0.4,"su":6.6,"so":324,"sf":2.3,"ch":8,"ing":[[300,"g","radish","trimmed","produce",0],[14,"g","butter","","dairy",0],[15,"mL","olive oil","","pantry",1],[25,"g","sugar","","pantry",1],[0,"to_taste","salt","","spice",1],[0,"to_taste","black pepper","","spice",1],[1,"bunch","parsley","chopped","produce",0]],"st":["Wash and trim radishes, if large cut them in half.","Add radishes to a deep pan, add enough water to cover them.","Add the butter, olive oil, sugar and salt.","Cover and bring to a boil.","Reduce heat to medium low and simmer, covered for 12 minutes. (radishes should be tender and the liquid reduced to a glaze)","If the radishes are cooked before the liquid has reduced then remove the radishes and cook liquid, uncovered until it thickens to a glaze.","Toss the radishes in the glaze, sprinkle with the pepper and parsley and serve."],"ad":"","on":"","sim":[133628,197244,359149]},{"i":480225,"n":"Carrot & Caraway Slaw","r":"s","g":"Salads","sv":4,"t":17,"pa":0,"rt":5.0,"rv":7,"k":72,"p":1,"cb":9.2,"f":3.8,"fi":2.7,"su":4.9,"so":341,"sf":0.5,"ch":0,"ing":[[5,"mL","caraway seed","","spice",0],[4,"count","carrot","grated","produce",0],[30,"mL","cider vinegar","","pantry",0],[15,"mL","olive oil","","pantry",1],[22,"mL","honey","","pantry",0],[0,"to_taste","salt","","spice",1]],"st":["Caraways taste best when toasted, so please add the caraway seeds to a dry pan over medium heat, stir constantly for 2 minutes.","In a large bowl add the carrots, caraway seeds, vinegar, olive oil, honey and salt.","Taste and add more salt if desired.","This makes a lovely side dish."],"ad":"","on":"","sim":[453832,67689,103328]},{"i":482774,"n":"Manchego Con Tomates Y Romero","r":"s","g":"Vegetables","sv":4,"t":10,"pa":0,"rt":5.0,"rv":3,"k":117,"p":1.6,"cb":3.2,"f":11.5,"fi":1.2,"su":1.7,"so":3,"sf":1.4,"ch":0,"ing":[[56,"g","manchego cheese","shaved","dairy",0],[30,"g","walnuts","toasted","pantry",0],[1,"count","tomato","pureed","produce",0],[30,"mL","olive oil","","pantry",1],[1,"bunch","rosemary","chopped","produce",0],[0,"to_taste","black pepper","cracked","spice",1],[0,"to_taste","sea salt","","spice",1]],"st":["Note: you can puree the tomatoes by hand using a cheese grater or use a mini food-processor. If doing by hand, discard the tomato skins. For convenience, I used a food processor.","Toast the walnuts for 5 minutes in a 350 degree oven. Set aside to cool.","Place all the ingredients in a non-reactive bowl and stir to combine.","Serve immediately.","This is wonderful on crusty artisan bread!"],"ad":"","on":"","sim":[]},{"i":483349,"n":"Spanish Grilled Chicken Breasts","r":"m","g":"Chicken","sv":4,"t":25,"pa":180,"rt":5.0,"rv":11,"k":349,"p":30.9,"cb":8.3,"f":21.6,"fi":1.7,"su":3.5,"so":946,"sf":4.1,"ch":82,"ing":[[60,"mL","olive oil","","pantry",1],[1,"bunch","tarragon","chopped","produce",0],[30,"mL","sherry vinegar","","pantry",0],[1,"count","orange","zested and juiced","produce",0],[1,"count","lemon","zested and juiced","produce",0],[0,"to_taste","kosher salt","","spice",1],[1,"count","garlic clove","minced","produce",0],[10,"g","fresh ginger","grated","produce",0],[2.5,"mL","hot paprika","","spice",0],[0,"to_taste","black pepper","","spice",1],[680,"g","chicken breast boneless skinless","","meat",0]],"st":["To make the marinade:  In a medium bowl, whisk all ingredients except the chicken.","Place the chicken breasts in a large, resealable bag, and pour in the marinade.  Press the air out of the bag and seal tightly.  Turn i _taste","black pepper","ground","spice",1],[3,"count","garlic clove","","produce",0],[2,"count","plum tomato","halved","produce",0]],"st":["Remove leaves and trim stem end of cauliflower, leaving core intact. Slice cauliflower into four 1/2\" \"steaks\" from center of cauliflower (some florets will break loose; reserve).","Finely chop enough loose florets to measure 1/2 cup.","Transfer chopped florets to a small bowl and mix with olives, sun-dried tomatoes, 1 tablespoon oil, parsley, and lemon juice. Season relish with salt and pepper.","Preheat oven to 400°. Heat 1 tablespoon olive oil in a large heavy ovenproof skillet over medium-high heat. Cook cauliflower steaks until golden brown, about 2 minutes per side, adding tablespoon oil to pan between batches.","Transfer steaks to a large rimmed baking sheet. Reserve skillet. Roast cauliflower until tender, about 15 minutes.","Meanwhile, return skillet to medium-high heat and add garlic cloves and tomatoes, one cut side down. Cook until tomatoes are browned; turn tomatoes over and transfer skillet to oven with cauliflower. Roast garlic and tomatoes until tender, about 12 minutes.","Transfer garlic, tomatoes, and 1/2 tablespoon oil to a blender; purée until smooth. Season with salt and pepper. Divide tomato sauce among plates. Place 1 cauliflower steak on each plate; spoon relish over. Serve warm or at room temperature."],"ad":"","on":"","sim":[106251,276195]},{"i":505620,"n":"Ras El Hanout Roasted Potatoes","r":"s","g":"Potatoes","sv":4,"t":30,"pa":0,"rt":5.0,"rv":8,"k":115,"p":2.6,"cb":27,"f":0.2,"fi":2.9,"su":1.5,"so":301,"sf":0,"ch":0,"ing":[[3,"count","white potato","halved","produce",0],[1,"count","lemon","","produce",0],[2,"count","garlic clove","","produce",0],[10,"mL","ras el hanout","","spice",0],[15,"mL","olive oil","","pantry",1]],"st":["Preheat the oven to 425F/220?C/Gas mark 7.","Peel and cut potatoes in half and boil until ‘al dente’. Make a dressing by mixing the juice of one lemon, garlic and Ras El Hanout. In a hot oven, pre-heat oil in a baking tray.","Once par-boiled, drain the potatoes in a colander and toss the potatoes to encourage a fluffy outer. Place the potatoes in a mixing bowl with the dressing and ensure that the potatoes are covered. Transfer the potatoes into the hot tray and roast for 25 minutes."],"ad":"","on":"","sim":[99743,112677,42280]},{"i":505800,"n":"Persian Meat Patties","r":"m","g":"Turkey","sv":6,"t":20,"pa":0,"rt":5.0,"rv":3,"k":317,"p":24.9,"cb":6.9,"f":21.9,"fi":1.4,"su":1.7,"so":493,"sf":5,"ch":153,"ing":[[680,"g","ground turkey","","meat",0],[1,"count","yellow onion","","produce",0],[1,"bunch","parsley","","produce",0],[1,"bunch","cilantro","","produce",0],[1,"count","lemon","zested","produce",0],[5,"mL","ground cumin","","spice",0],[0,"to_taste","salt","","spice",1],[0,"to_taste","black pepper","","spice",1],[2.5,"mL","ground turmeric","","spice",0],[60,"g","chickpea flour","","pantry",0],[2,"count","egg","","dairy",0],[30,"mL","olive oil","","pantry",1]],"st":["Mix everything but the oil, including the ground turkey.","Mix well.","Shape patties the size of an egg.","Flatten.","Fry in the olive oil over medium heat, about 4 to 5 minutes per side, until the internal temperature reaches 165 F (74 C)."],"ad":"Ground beef swapped for ground turkey, with oil added for moisture and frying.","on":"Persian  Meat Patties","sim":[192257,266209,292448]},{"i":506787,"n":"Baked Panko Chicken Parmesan","r":"m","g":"Chicken","sv":4,"t":42,"pa":0,"rt":5.0,"rv":10,"k":260,"p":15.7,"cb":25.5,"f":10.1,"fi":1.6,"su":2.4,"so":1136,"sf":4.5,"ch":154,"ing":[[240,"g","chicken tenderloin","","meat",0],[60,"g","chicken breast boneless skinless","","meat",0],[33,"g","parmesan cheese","grated","dairy",0],[35,"g","parmesan cheese","grated","dairy",0],[60,"g","panko breadcrumbs","","pantry",0],[0,"to_taste","salt","","spice",1],[0,"to_taste","black pepper","","spice",1],[1.25,"mL","garlic powder","","spice",1],[3,"count","egg","","dairy",0]],"st":["Preheat oven to 350 degrees.","Beat eggs in a  bowl.  Combine cheeses, bread crumbs and spices in a separate bowl.","Dip chicken pieces in egg, then bread crumb mixture, then egg, then bread crumb mixture again.","Place chicken on a cookie sheet and bake at 350 degrees for 35 minutes.","Serve over pasta with marinara sauce and mozzarella. Or place chicken on a hoagie roll with marinara and mozzarella for a Chicken Parmesan Sub.  Also great for dipping with marinara or ranch."],"ad":"","on":"","sim":[3166,359280,3548]},{"i":512630,"n":"Simple Roasted Baby Bok Choy","r":"s","g":"Vegetables","sv":4,"t":26,"pa":0,"rt":5.0,"rv":3,"k":75,"p":1.7,"cb":2.6,"f":7,"fi":1.2,"su":1.3,"so":365,"sf":1,"ch":0,"ing":[[454,"g","baby bok choy","halved","produce",0],[30,"mL","olive oil","","pantry",1],[0,"to_taste","salt","","spice",1],[0,"to_taste","black pepper","","spice",1]],"st":["Preheat oven to 350°F.","Onto a large baking sheet, spread halved heads of baby bok choy into a single layer.","Drizzle with olive oil and sprinkle with salt and pepper.","Roast for 12 minutes.  Using tongs, turn each bok choy to ensure both sides are nicely browned.  Return to oven to roast for another 12 minutes.","Serve immediately and enjoy."],"ad":"","on":"","sim":[]},{"i":527548,"n":"Lentil, Bean & Parsley Salad","r":"s","g":"Beans and lentils","sv":4,"t":40,"pa":0,"rt":5.0,"rv":3,"k":134,"p":5.3,"cb":13.6,"f":7.1,"fi":5.3,"su":2.7,"so":25,"sf":1,"ch":0,"ing":[[50,"g","lentils","","pantry",0],[85,"g","green lentils","","pantry",0],[500,"mL","water","","other",1],[15,"mL","olive oil","","pantry",1],[30,"mL","lemon juice","","produce",0],[15,"mL","red wine vinegar","","pantry",0],[4,"g","sugar","","pantry",1],[154,"g","green beans","blanched","produce",0],[1,"count","celery","sliced","produce",0],[1,"bunch","flat leaf parsley","chopped","produce",0]],"st":["Put the lentils in a saucepan with the water over medium-high heat, and bring to a boil. Reduce the heat and simmer until the lentils are tender, about 15 to 20 minutes. Drain the water and reserve the lentils.","In a large bowl, whisk together the olive oil, lemon juice, vinegar, sugar, and season with salt and pepper, to taste. Stir in the lentils and leave them out to cool.","Meanwhile, blanch the green beans in a saucepan of boiling water until they are bright green and crisply tender. Rinse the beans under cold running water, and then drain well. Add the beans, celery and parsley to the lentils and toss the ingredients gently."],"ad":"","on":"","sim":[14804,16666]}]</script>
<script>
(function () {
  "use strict";
  var RECIPES = JSON.parse(document.getElementById("data").textContent);
  var BY_ID = {};
  RECIPES.forEach(function (r) {
    BY_ID[r.i] = r;
    r.score = (r.rt * r.rv + 4.5 * 8) / (r.rv + 8);
    r.blob = (r.n + " " + r.ing.map(function (x) { return x[2]; }).join(" ")).toLowerCase();
    r.lean = r.k ? r.p / r.k : 0;
  });
  var GROUP_LABEL = { "Fish and seafood": "Salmon and tuna", "Beans, tofu and eggs": "Beans, tofu, eggs", "Other meat": "Other meat" };
  var MAIN_GROUPS = ["Chicken", "Turkey", "Pork", "Fish and seafood", "Beans, tofu and eggs", "Vegetarian", "Lamb"];
  var SIDE_GROUPS = ["Vegetables", "Potatoes", "Rice and grains", "Beans and lentils", "Salads", "Corn"];
  var QUICK = [["t20", "20 min"], ["t30", "30 min"], ["t40", "40 min"], ["hp", "35 g protein +"], ["lc", "Under 400 kcal"], ["ls", "Low sodium"], ["fb", "High fibre"], ["nw", "No waiting"], ["fav", "Favourites"]];
  var PER = 48;

  var S = { q: "", role: "all", groups: {}, quick: {}, sort: "top", shown: PER, favs: {}, units: "metric", plan: [] };
  var open = null;    // recipe sheet state: {id, servings, checks, done, basis}
  var timers = [];
  var cookState = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var ICON = {
    heart: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-9-9.2C1.8 7.6 3.7 4.5 6.9 4.5c1.8 0 3.2 1 4.1 2.4h2c.9-1.4 2.3-2.4 4.1-2.4 3.2 0 5.1 3.1 3.9 6.3C19 15.600 12 20 12 20z"/></svg>',
    clock: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    back: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    flame: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 3.500 5 5.500 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 2.500 1.500 2.500C11 9 10.500 6 12 3z"/></svg>',
    close: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.500l2.900 6.100 6.600.8-4.900 4.600 1.300 6.600L12 17.300 6.100 20.600l1.300-6.600L2.500 9.400l6.600-.8z"/></svg>'
  };

  /* ---------- storage: per-viewer convenience in the browser, favourites and units in the db when available ---------- */
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage can be blocked */ } }
  var prefsDoc = null, writeTimer = 0, writing = false, dirty = false;
  function prefsPayload() { return { favs: Object.keys(S.favs).map(Number), units: S.units, plan: S.plan.map(function (e) { return e.m === undefined ? [e.i, e.sv] : [e.i, e.sv, e.m]; }) }; }
  var planLocked = false;
  function applyPrefs(p) {
    if (!p) return;
    if (Array.isArray(p.favs)) { S.favs = {}; p.favs.forEach(function (i) { S.favs[i] = true; }); }
    if (p.units === "us" || p.units === "metric") S.units = p.units;
    if (Array.isArray(p.plan) && !planLocked) S.plan = p.plan.map(function (a) { var e = { i: Number(a[0]), sv: Number(a[1]) }; if (a.length > 2) e.m = Number(a[2]); return e; }).filter(function (e) { return BY_ID[e.i] && e.sv > 0; });
  }
  function savePrefs() {
    lsSet("dinnerbook.prefs", prefsPayload());
    if (!prefsDoc) return;
    dirty = true;
    clearTimeout(writeTimer);
    writeTimer = setTimeout(flush, 600);
  }
  function flush() {
    if (writing || !dirty || !prefsDoc) return;
    writing = true; dirty = false;
    prefsDoc.set(prefsPayload()).catch(function () { prefsDoc = null; }).then(function () { writing = false; if (dirty) flush(); });
  }
  function saveFilters() { lsSet("dinnerbook.filters", { q: S.q, role: S.role, groups: S.groups, quick: S.quick, sort: S.sort }); }
  function connectDb() {
    if (!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (uid) {
        if (!uid) return null;
        var doc = db.doc("data/users/" + uid + "/prefs");
        var first = true;
        doc.onSnapshot(function (snap) {
          if (snap.metadata && snap.metadata.hasPendingWrites) return;
          if (snap.exists) { applyPrefs(snap.data()); lsSet("dinnerbook.prefs", prefsPayload()); updatePlanBadge(); renderAll(); if (open) renderSheet(true); if (planOpen) renderPlan(); }
          else if (first) { prefsDoc = doc; savePrefs(); }
          prefsDoc = doc; first = false;
        }, function () { prefsDoc = null; });
      });
    }).catch(function () { /* the page works without it */ });
  }

  /* ---------- amounts ---------- */
  var FR = [[0, ""], [1 / 8, "⅛"], [1 / 4, "¼"], [1 / 3, "⅓"], [3 / 8, "⅜"], [1 / 2, "½"], [5 / 8, "⅝"], [2 / 3, "⅔"], [3 / 4, "¾"], [7 / 8, "⅞"], [1, ""]];
  function frac(v) {
    var w = Math.floor(v), rem = v - w, best = FR[0], d = 9;
    FR.forEach(function (f) { var dd = Math.abs(rem - f[0]); if (dd < d) { d = dd; best = f; } });
    if (best[0] === 1) { w += 1; best = FR[0]; }
    if (w === 0 && best[0] === 0) return "0";
    return (w ? String(w) : "") + best[1];
  }
  function trimNum(v, dec) { var s = v.toFixed(dec); return s.replace(/\.?0+$/, ""); }
  function fmtMetric(unit, a) {
    if (unit === "g") {
      if (a >= 1000) return trimNum(a / 1000, 2) + " kg";
      return Math.round(a >= 50 ? a / 5 : a) * (a >= 50 ? 5 : 1) + " g";
    }
    if (a >= 1000) return trimNum(a / 1000, 2) + " L";
    if (a >= 60) return Math.round(a / 5) * 5 + " mL";
    return trimNum(a, a < 10 ? 1 : 0) + " mL";
  }
  function fmtUS(unit, a) {
    if (unit === "g") {
      if (a < 7) { var ts = a / 4.5; return ts < 0.1 ? "pinch" : frac(ts) + " tsp"; }
      var oz = a / 28.35;
      if (oz < 16) return (oz < 1 ? trimNum(oz, 1) : String(Math.round(oz * 2) / 2).replace(".5", "½").replace(/^0½$/, "½")) + " oz";
      var lb = Math.floor(oz / 16), rest = Math.round(oz - lb * 16);
      if (rest === 16) { lb += 1; rest = 0; }
      return lb + " lb" + (rest ? " " + rest + " oz" : "");
    }
    var tsp = a / 4.93;
    if (tsp < 0.1) return "pinch";
    if (a < 15) return frac(tsp) + " tsp";
    if (a < 59) return frac(a / 14.79) + " tbsp";
    var cups = a / 236.6;
    if (cups >= 4) return frac(a / 946.4) + " qt";
    return frac(cups) + " cup" + (cups > 1.05 ? "s" : "");
  }
  var NOPLURAL = /(broccoli|asparagus|lettuce|celery|kale|spinach|cilantro|parsley|basil|salsa|sauce|tofu|cheese|bread|pasta|rice|oil|butter|milk|corn|squash|cob|\smL|\sg)$/i;
  function plural(item, n) {
    if (n <= 1.05 || NOPLURAL.test(item) || /s$/i.test(item)) return item;
    if (/(lea|loa)f$/i.test(item)) return item.slice(0, -1) + "ves";
    if (/(ato)$/i.test(item)) return item + "es";
    if (/[^aeiou]y$/i.test(item)) return item.slice(0, -1) + "ies";
    if (/(ch|sh|x)$/i.test(item)) return item + "es";
    return item + "s";
  }
  function line(ing, f) {
    var a = ing[0], unit = ing[1], item = ing[2], prep = ing[3];
    var amt, name = item;
    if (unit === "to_taste") amt = "to taste";
    else {
      var v = a * f;
      if (unit === "count") { amt = v >= 10 ? String(Math.round(v)) : frac(v); name = plural(item, v); }
      else if (unit === "bunch") amt = (v >= 0.95 && v <= 1.05) ? "1 bunch" : frac(v) + " bunch";
      else amt = S.units === "us" ? fmtUS(unit, v) : fmtMetric(unit, v);
    }
    return { amt: amt, name: name, prep: prep };
  }

  /* ---------- list ---------- */
  function groupLabel(g) { return GROUP_LABEL[g] || g; }
  function passes(r) {
    if (S.role !== "all" && r.r !== S.role) return false;
    var gs = Object.keys(S.groups);
    if (gs.length && !S.groups[r.g]) return false;
    var q = S.quick;
    if (q.t20 && r.t > 20) return false;
    if (q.t30 && r.t > 30) return false;
    if (q.t40 && r.t > 40) return false;
    if (q.hp && r.p < 35) return false;
    if (q.lc && r.k > 400) return false;
    if (q.ls && r.so > 600) return false;
    if (q.fb && r.fi < 6) return false;
    if (q.nw && r.pa > 0) return false;
    if (q.fav && !S.favs[r.i]) return false;
    var toks = S.q.toLowerCase().split(/[\s,]+/).filter(Boolean);
    for (var i = 0; i < toks.length; i++) {
      var t = toks[i];
      if (t[0] === "-") { if (t.length > 1 && r.blob.indexOf(t.slice(1)) >= 0) return false; }
      else if (r.blob.indexOf(t) < 0) return false;
    }
    return true;
  }
  var SORTS = {
    top: function (a, b) { return b.score - a.score || b.rv - a.rv; },
    fast: function (a, b) { return a.t - b.t || b.score - a.score; },
    protein: function (a, b) { return b.p - a.p || b.score - a.score; },
    lean: function (a, b) { return b.lean - a.lean || b.score - a.score; },
    kcal: function (a, b) { return a.k - b.k || b.score - a.score; },
    az: function (a, b) { return a.n.localeCompare(b.n); }
  };
  function filtered() { return RECIPES.filter(passes).sort(SORTS[S.sort]); }
  function macroBar(r) {
    var p = r.p * 4, c = r.cb * 4, f = r.f * 9, t = (p + c + f) || 1;
    return '<span class="mini" aria-hidden="true"><i class="p" style="flex:' + (p / t).toFixed(3) + '"></i><i class="c" style="flex:' + (c / t).toFixed(3) + '"></i><i class="f" style="flex:' + (f / t).toFixed(3) + '"></i></span>';
  }
  function minutes(t) { return t < 60 ? t + " min" : Math.floor(t / 60) + " h" + (t % 60 ? " " + (t % 60) + " min" : ""); }
  function card(r) {
    var fav = !!S.favs[r.i];
    return '<article class="card"><button class="open" type="button" data-open="' + r.i + '">' +
      '<span class="tags"><span class="tag ' + (r.r === "s" ? "side" : "") + '">' + esc(groupLabel(r.g)) + '</span>' +
      (r.on ? '<span class="tag warn">Adapted</span>' : "") + (r.pa ? '<span class="tag info">Plan ahead</span>' : "") + '</span>' +
      '<span class="ct">' + esc(r.n) + '</span>' +
      '<span class="stats num"><span><b>' + minutes(r.t) + '</b><span>cook time</span></span><span><b>' + r.k + '</b><span>kcal</span></span><span><b>' + r.p + ' g</b><span>protein</span></span></span>' +
      macroBar(r) +
      '<span class="rate num">' + r.rt.toFixed(1) + ' of 5 &middot; ' + r.rv + ' review' + (r.rv === 1 ? "" : "s") + '</span></button>' +
      '<button class="heart" type="button" data-fav="' + r.i + '" aria-pressed="' + fav + '" aria-label="' + (fav ? "Remove from favourites: " : "Add to favourites: ") + esc(r.n) + '">' + ICON.heart + '</button></article>';
  }
  function chipHtml(key, label, on, cls) { return '<button type="button" class="chip ' + (cls || "") + '" data-k="' + key + '" aria-pressed="' + !!on + '">' + esc(label) + '</button>'; }
  function renderChips() {
    $("roles").innerHTML = [["all", "All"], ["m", "Main dishes"], ["s", "Side dishes"]].map(function (x) { return chipHtml("role:" + x[0], x[1], S.role === x[0]); }).join("");
    var groups = S.role === "m" ? MAIN_GROUPS : S.role === "s" ? SIDE_GROUPS : MAIN_GROUPS.concat(SIDE_GROUPS);
    $("groups").innerHTML = groups.map(function (g) { return chipHtml("group:" + g, groupLabel(g), S.groups[g], SIDE_GROUPS.indexOf(g) >= 0 ? "side" : ""); }).join("");
    $("quick").innerHTML = QUICK.map(function (x) { return chipHtml("quick:" + x[0], x[1], S.quick[x[0]]); }).join("");
  }
  function renderAll() {
    var list = filtered();
    $("count").textContent = RECIPES.length + " dinners";
    $("shown").textContent = list.length === RECIPES.length ? "All " + list.length + " dinners" : list.length + " of " + RECIPES.length + " dinners";
    var any = S.q || S.role !== "all" || Object.keys(S.groups).length || Object.keys(S.quick).length;
    $("reset").hidden = !any;
    $("searchbox").classList.toggle("has", !!S.q);
    var slice = list.slice(0, S.shown);
    $("grid").innerHTML = slice.length ? slice.map(card).join("") :
      '<div class="empty" style="grid-column:1/-1"><h2>Nothing matches yet</h2><p>Try fewer filters or a different ingredient.</p><button class="btn primary" type="button" data-reset="1">Clear filters</button></div>';
    $("more").hidden = list.length <= S.shown;
    $("more").textContent = "Show " + Math.min(PER, list.length - S.shown) + " more";
    renderChips();
  }

  /* ---------- recipe sheet ---------- */
  function stars(rt) {
    var out = "";
    for (var i = 1; i <= 5; i++) out += '<span class="' + (rt >= i - 0.25 ? "" : "off") + '">' + ICON.star + '</span>';
    return '<span class="stars" role="img" aria-label="' + rt.toFixed(1) + ' out of 5">' + out + '</span>';
  }
  function dvp(v, d) { return Math.round(v / d * 100) + " %"; }
  function nutrition(r, whole) {
    var m = whole ? r.sv : 1, k = Math.round(r.k * m);
    function g(v) { return trimNum(v * m, v * m < 10 ? 1 : 0); }
    var rows = [
      ["Fat", g(r.f) + " g", dvp(r.f * m, 75), 0], ["Saturated", g(r.sf) + " g", dvp(r.sf * m, 20), 1],
      ["Carbohydrate", g(r.cb) + " g", dvp(r.cb * m, 275), 0], ["Fibre", g(r.fi) + " g", dvp(r.fi * m, 28), 1], ["Sugars", g(r.su) + " g", dvp(r.su * m, 100), 1],
      ["Protein", g(r.p) + " g", "", 0], ["Cholesterol", Math.round(r.ch * m) + " mg", "", 0], ["Sodium", Math.round(r.so * m) + " mg", dvp(r.so * m, 2300), 0]
    ];
    return '<div class="label"><h4>Nutrition Facts</h4><div class="per"><span>Per ' + (whole ? "whole recipe (" + r.sv + " servings)" : "serving") + '</span></div>' +
      '<div class="cal"><span><b class="num">Calories</b></span><b class="num">' + k + '</b></div><div class="dv">% Daily Value (approximate)</div>' +
      rows.map(function (x) { return '<div class="row num ' + (x[3] ? "sub" : "") + '"><span>' + (x[3] ? x[0] : "<b>" + x[0] + "</b>") + " " + x[1] + '</span><b>' + x[2] + '</b></div>'; }).join("") +
      '<div class="foot">Estimated from the ingredients and the recipe source.</div></div>';
  }
  function donut(r) {
    var p = r.p * 4, c = r.cb * 4, f = r.f * 9, t = (p + c + f) || 1, R = 52, C = 2 * Math.PI * R, off = 0, segs = "";
    [[p, "var(--protein)"], [c, "var(--carb)"], [f, "var(--fat)"]].forEach(function (s) {
      var len = s[0] / t * C;
      segs += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + s[1] + '" stroke-width="18" stroke-dasharray="' + Math.max(len - 2, 0).toFixed(2) + " " + C.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)"/>';
      off += len;
