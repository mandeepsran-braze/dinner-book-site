      (plan.length ? '<button class="btn" type="button" data-pcopy="list">Copy list</button><button class="btn" type="button" data-pcopy="code">Copy code</button>' : "") + '</div></div>';
    var html = '<div class="sheet-in">' + bar + '<h2 class="title">Your plan</h2>';
    if (planNotice) html += '<p class="callout warn">' + esc(planNotice) + '</p>';
    if (!plan.length) {
      el.innerHTML = html + '<div class="empty"><h2>No recipes in the plan yet</h2><p>Open any recipe and tap Add to plan. The shopping list and every recipe appear here. A plan link does the same in one step.</p><button class="btn primary" type="button" data-planclose="1">Browse recipes</button></div></div>';
      el.hidden = false; return;
    }
    var sched = schedule(plan);
    var tot = 0, k = 0, p = 0, cb = 0, f = 0, mins = 0, ahead = [];
    plan.forEach(function (e) { var r = BY_ID[e.i]; tot += e.sv; k += r.k * e.sv; p += r.p * e.sv; cb += r.cb * e.sv; f += r.f * e.sv; mins += r.t; if (r.pa) ahead.push(r.n + " (" + minutes(r.pa) + " wait)"); });
html += sched.stats ?
      '<div class="facts num"><div><b>' + sched.stats.nights + '</b><span>Dinners</span></div><div><b>' + plan.length + '</b><span>Recipes</span></div><div><b>' + minutes(mins) + '</b><span>Cooking, back to back</span></div><div><b>' + sched.stats.k + ' kcal</b><span>Average dinner</span></div><div><b>' + sched.stats.p + ' g</b><span>Protein per dinner</span></div></div>' :
      '<div class="facts num"><div><b>' + plan.length + '</b><span>Recipes</span></div><div><b>' + tot + '</b><span>Servings</span></div><div><b>' + minutes(mins) + '</b><span>Cooking, back to back</span></div><div><b>' + Math.round(k / tot) + ' kcal</b><span>Average serving</span></div><div><b>' + Math.round(p / tot) + ' g</b><span>Protein per serving</span></div></div>';
    if (ahead.length) html += '<p class="callout info"><b>Plan ahead.</b> ' + esc(ahead.join("; ")) + '</p>';
    html += sched.html;
    // shopping list
    var items = shoppingList(), have = {};
    S.plan.forEach(function (e) { have[e.i] = true; });
    html += '<section class="sec"><h3>Shopping list <span class="seg" role="group" aria-label="Units"><button type="button" data-units="metric" aria-pressed="' + (S.units === "metric") + '">Metric</button><button type="button" data-units="us" aria-pressed="' + (S.units === "us") + '">US</button></span></h3>';
    SECTION_ORDER.forEach(function (sec) {
      var rows = items.filter(function (o) { return !o.staple && o.section === sec; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      if (rows.length) html += '<div class="sgroup"><h4>' + SECTION_LABEL[sec] + '</h4><ul class="shop">' + rows.map(shopRow).join("") + '</ul></div>';
    });
    var st = items.filter(function (o) { return o.staple; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    if (st.length) html += '<div class="sgroup"><details class="pd"><summary>Probably in your pantry (' + st.length + ')</summary><ul class="shop" style="border:0">' + st.map(shopRow).join("") + '</ul></details></div>';
    html += '<p class="note" style="margin-top:10px">Amounts add up across the recipes. Amounts are estimates, and the buy hints use typical pack sizes, not a store\'s stock.</p></section>';
    // leftovers
    var left = items.filter(function (o) { return !o.staple && o.unit === "g" && /^(meat|seafood|produce|dairy)$/.test(o.section) && o.left >= 150 && o.left >= o.bought * 0.3; }).sort(function (a, b) { return b.left - a.left; }).slice(0, 4);
    var use = left.map(function (o) {
      var rs = recipesUsing(o.key, have); if (!rs.length) return "";
      return '<p>About <b>' + esc(fmtAmount("g", o.left)) + '</b> of ' + esc(o.name) + ' is left over after shopping.<span class="links">' + rs.map(function (r) { return '<button type="button" data-open="' + r.i + '">' + esc(r.n) + '</button>'; }).join("") + '</span></p>';
    }).filter(Boolean);
    if (use.length) html += '<section class="sec"><h3>Use up the leftovers</h3><div class="use">' + use.join("") + '</div></section>';
    // recipes
    html += '<section class="sec"><h3>Recipes <small>Change servings or remove</small></h3><div class="plist">' + plan.map(function (e) {
      var r = BY_ID[e.i];
      return '<div class="pcard"><button class="nm" type="button" data-open="' + r.i + '">' + esc(r.n) + '</button><div class="sub num">' + (r.r === "m" ? "Main" : "Side") + ' &middot; ' + minutes(r.t) + ' &middot; ' + r.k + ' kcal &middot; ' + r.p + ' g protein per serving</div>' +
        '<div class="row2"><div class="stepper" role="group" aria-label="Servings"><button type="button" data-psv="' + r.i + ':-1" aria-label="Fewer servings">&minus;</button><output class="num">' + e.sv + ' serving' + (e.sv === 1 ? "" : "s") + '</output><button type="button" data-psv="' + r.i + ':1" aria-label="More servings">+</button></div><span class="sub">' + dinners(e.sv) + '</span><button class="linkbtn" type="button" data-prem="' + r.i + '">Remove</button></div></div>';
    }).join("") + '</div></section>';
    // full recipes
    html += '<section class="sec"><h3>Cook from here <small>Amounts match your servings</small></h3><div class="plist">' + plan.map(function (e) {
      var r = BY_ID[e.i], fct = e.sv / r.sv;
      var ing = r.ing.map(function (x) { var l = line(x, fct); return "<li>" + esc(l.amt) + " " + esc(l.name) + (l.prep ? ", " + esc(l.prep) : "") + "</li>"; }).join("");
      var steps = r.st.map(function (s) {
        var tm = stepTimers(s).map(function (t) { return '<button class="tbtn" type="button" data-timer="' + t.sec + '" data-label="' + esc(t.label) + '" data-rname="' + esc(r.n) + '">' + ICON.clock + " Start " + esc(t.label) + " timer</button>"; }).join("");
        return "<li><div><div>" + esc(s) + "</div>" + (tm ? '<div class="timers">' + tm + "</div>" : "") + "</div></li>";
      }).join("");
      return '<details class="pd"><summary>' + esc(r.n) + ' <span class="sub num">&middot; ' + e.sv + ' serving' + (e.sv === 1 ? "" : "s") + '</span></summary><ul>' + ing + '</ul><ol class="steps">' + steps + '</ol><button class="btn primary" type="button" data-pcook="' + r.i + '">Cook mode</button><p style="margin:12px 0 0"></p></details>';
    }).join("") + '</div></section>';
    html += '<section class="sec foot-note"><h3>Plan code</h3><p class="note">Add this to the end of the page link to open this exact plan again, or send it to someone.</p><input class="codebox" readonly value="#' + code + '" aria-label="Plan code" onfocus="this.select()"></section></div>';
    el.innerHTML = html; el.hidden = false; el.scrollTop = top;
  }
  function openPlan() { planOpen = true; renderPlan(); syncScroll(); if (S.plan.length) setHash(planCode()); }
  function hidePlan() { planOpen = false; $("plan").hidden = true; $("plan").innerHTML = ""; syncScroll(); }
  function planFromSearch() {
    // Works on a self-hosted copy: ?plan=370461x4,169738x4. Artifact pages never see the query string, only the hash.
    try {
      var q = new URLSearchParams(location.search).get("plan"); if (!q) return "";
      return "#plan-" + q.split(",").map(function (meal) { return meal.split(/[+\s]+/).filter(Boolean).join("p"); }).filter(Boolean).join("_");
    } catch (e) { return ""; }
  }
  function route(initial) {
    var h = location.hash || (initial === true ? planFromSearch() : ""), mp = PLAN_RX.exec(h), mr = /^#r-(\d+)$/.exec(h);
    if (mp) {
      var parsed = parsePlan(h);
      if (!parsed) return;
      if (planOpen && parsed.entries.length === S.plan.length && planCode() === codeOf(parsed.entries)) { if (open) hideSheet(); return; }
      planLocked = true; planNotice = parsed.unknown ? parsed.unknown + " recipe" + (parsed.unknown === 1 ? "" : "s") + " in this link " + (parsed.unknown === 1 ? "is" : "are") + " not in the book any more." : "";
      S.plan = parsed.entries; savePrefs(); updatePlanBadge(); if (open) hideSheet(); planOpen = true; renderPlan(); syncScroll();
      if (!location.hash) setHash(planCode());
      return;
    }
    if (mr) { if (!open) openRecipe(Number(mr[1]), false); return; }
    if (open) hideSheet(); else if (planOpen) hidePlan();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button, input, .txt, label");
    if (!t) return;
    var d = t.dataset || {};
    if (t.id === "planbtn") { openPlan(); return; }
    if (d.planclose) { hidePlan(); setHash(""); return; }
    if (d.padd) { var pid = Number(d.padd); if (inPlan(pid)) setPlan(S.plan.filter(function (e) { return e.i !== pid; })); else setPlan(S.plan.concat([{ i: pid, sv: BY_ID[pid].sv }])); if (open) renderSheet(true); return; }
    if (d.psv) { var pp = d.psv.split(":"); setPlan(S.plan.map(function (e) { return e.i === Number(pp[0]) ? { i: e.i, sv: Math.min(24, Math.max(1, e.sv + Number(pp[1]))), m: e.m } : e; })); return; }
    if (d.prem) { setPlan(S.plan.filter(function (e) { return e.i !== Number(d.prem); })); return; }
    if (d.pcopy) { var btn = t; copyText(d.pcopy === "list" ? shopText() : "#" + planCode(), function (ok) { var old = btn.textContent; btn.textContent = ok ? "Copied" : "Press and hold the code below"; setTimeout(function () { btn.textContent = old; }, 1600); }); return; }
    if (d.pcook) { var pe = S.plan.filter(function (e) { return e.i === Number(d.pcook); })[0]; if (pe) startCook(pe.i, pe.sv); return; }
    if (d.ptick !== undefined && t.tagName === "INPUT") { ticks.v[d.ptick] = t.checked; lsSet("dinnerbook.ticks." + ticks.code, ticks.v); return; }
    if (d.open) { openRecipe(Number(d.open)); return; }
    if (d.fav) { var id = Number(d.fav); if (S.favs[id]) delete S.favs[id]; else S.favs[id] = true; savePrefs(); renderAll(); if (open) renderSheet(true); if (planOpen) renderPlan(); e.stopPropagation(); return; }
    if (d.close) { closeRecipe(); return; }
    if (d.cook) { startCook(open.id, open.servings); return; }
    if (d.cookclose) { endCook(); return; }
    if (d.cooknav && cookState) { var r = BY_ID[cookState.id], nn = cookState.n + Number(d.cooknav); if (nn >= r.st.length) { endCook(); return; } cookState.n = Math.max(0, nn); renderCook(); return; }
    if (d.srv && open) { open.servings = Math.min(24, Math.max(1, open.servings + Number(d.srv))); renderSheet(true); return; }
    if (d.units) { S.units = d.units; savePrefs(); if (open) renderSheet(true); if (planOpen) renderPlan(); if (cookState) renderCook(); return; }
    if (d.basis && open) { open.basis = d.basis; renderSheet(true); return; }
    if (d.timer) { startTimer(Number(d.timer), d.label || "Timer", d.rname); return; }
    if (d.stop) { timers = timers.filter(function (x) { return String(x.id) !== d.stop; }); renderTimers(); return; }
    if (d.done !== undefined && open && t.classList.contains("txt")) { open.done[d.done] = !open.done[d.done]; renderSheet(true); return; }
    if (d.chk !== undefined && open && t.tagName === "INPUT") { open.checks[d.chk] = t.checked; return; }
    if (d.reset || t.id === "reset") { S.q = ""; S.role = "all"; S.groups = {}; S.quick = {}; S.shown = PER; $("q").value = ""; saveFilters(); renderAll(); return; }
    if (t.id === "more") { S.shown += PER; renderAll(); return; }
    if (t.id === "qclear") { S.q = ""; $("q").value = ""; S.shown = PER; saveFilters(); renderAll(); $("q").focus(); return; }
    if (t.id === "surprise") { var list = filtered(); if (list.length) openRecipe(list[Math.floor(Math.random() * list.length)].i); return; }
    if (d.k) {
      var parts = d.k.split(":"), kind = parts[0], val = parts.slice(1).join(":");
      if (kind === "role") { S.role = val; S.groups = {}; }
      if (kind === "group") { if (S.groups[val]) delete S.groups[val]; else S.groups[val] = true; }
      if (kind === "quick") {
        if (S.quick[val]) delete S.quick[val];
        else { if (/^t\d+$/.test(val)) ["t20", "t30", "t40"].forEach(function (x) { delete S.quick[x]; }); S.quick[val] = true; }
      }
      S.shown = PER; saveFilters(); renderAll();
    }
  });
  $("q").addEventListener("input", function (e) { S.q = e.target.value; S.shown = PER; saveFilters(); renderAll(); });
  $("sort").addEventListener("change", function (e) { S.sort = e.target.value; S.shown = PER; saveFilters(); renderAll(); });
  document.addEventListener("keydown", function (e) {
    if (cookState) {
      if (e.key === "ArrowRight") { var r = BY_ID[cookState.id]; if (cookState.n < r.st.length - 1) { cookState.n++; renderCook(); } }
      if (e.key === "ArrowLeft") { cookState.n = Math.max(0, cookState.n - 1); renderCook(); }
      if (e.key === "Escape") endCook();
    } else if (open && e.key === "Escape") closeRecipe();
    else if (planOpen && e.key === "Escape") { hidePlan(); setHash(""); }
  });
  var touchX = null;
  document.addEventListener("touchstart", function (e) { touchX = cookState ? e.touches[0].clientX : null; }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (touchX === null || !cookState) return;
    var dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) < 60) return;
    var r = BY_ID[cookState.id];
    if (dx < 0 && cookState.n < r.st.length - 1) cookState.n++; else if (dx > 0) cookState.n = Math.max(0, cookState.n - 1); else return;
    renderCook();
  }, { passive: true });
  window.addEventListener("hashchange", function () { route(); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && cookState) lockScreen(); });

  /* ---------- start ---------- */
  var f0 = lsGet("dinnerbook.filters");
  if (f0) { S.q = f0.q || ""; S.role = f0.role || "all"; S.groups = f0.groups || {}; S.quick = f0.quick || {}; S.sort = SORTS[f0.sort] ? f0.sort : "top"; }
  applyPrefs(lsGet("dinnerbook.prefs"));
  $("q").value = S.q; $("sort").value = S.sort;
  renderAll();
  updatePlanBadge();
  route(true);
  connectDb();
})();
</script>
